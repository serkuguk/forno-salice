<app-forno-shell>
  <section class="home-hero">
    <div class="home-hero__left">
      <p class="home-hero__eyebrow">Est. 2019 — Shoreditch, London</p>

      <h1 class="home-hero__title">
        <span class="home-hero__title-line home-hero__title-line--italic">Wood-fired</span>
        <span class="home-hero__title-line home-hero__title-line--strong">city pizza</span>
        <span class="home-hero__title-line home-hero__title-line--subtle">crafted without compromise</span>
      </h1>

      <p class="home-hero__copy">
        Neapolitan spirit. London pace. Same-day dough, open kitchen, and ingredients worth the journey.
      </p>

      <div class="home-hero__actions">
        <a class="home-hero__cta home-hero__cta--primary" routerLink="/menu">Order now</a>
        <a class="home-hero__cta home-hero__cta--ghost" routerLink="/build">Build your own</a>
      </div>
    </div>

    <div class="home-hero__right" aria-hidden="true">
      <div class="home-hero__texture"></div>
      <div class="home-hero__glow"></div>
      <div class="pizza">
        <div class="pizza__crust">
          <div class="pizza__sauce">
            <span class="pizza__cheese pizza__cheese--one"></span>
            <span class="pizza__cheese pizza__cheese--two"></span>
            <span class="pizza__cheese pizza__cheese--three"></span>
            <span class="pizza__dot pizza__dot--one"></span>
            <span class="pizza__dot pizza__dot--two"></span>
            <span class="pizza__dot pizza__dot--three"></span>
          </div>
        </div>
      </div>
    </div>
  </section>
</app-forno-shell>
