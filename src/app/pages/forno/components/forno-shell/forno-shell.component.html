<div class="forno-app">
  <nav class="forno-top-nav" aria-label="Main navigation">
    <div class="forno-top-nav__inner">
      <a class="forno-top-nav__logo" routerLink="/menu">
        Forno <span>&amp;</span> Slice
      </a>

      <div class="forno-top-nav__links">
        <a
          class="forno-top-nav__link"
          routerLink="/menu"
          [class.forno-top-nav__link--active]="isActive('/menu')">
          Menu
        </a>
        <a
          class="forno-top-nav__link"
          routerLink="/build"
          [class.forno-top-nav__link--active]="isActive('/build')">
          Build Your Own
        </a>
      </div>

      <div class="forno-top-nav__actions">
        <a
          class="forno-top-nav__kitchen"
          routerLink="/kitchen"
          [class.forno-top-nav__kitchen--active]="isActive('/kitchen')">
          KITCHEN
          <span>↗</span>
        </a>
        <button
          class="forno-top-nav__cart"
          type="button"
          [class.forno-top-nav__cart--active]="cartDrawer.isOpen()"
          (click)="cartDrawer.toggle()">
          <span class="material-icons">shopping_bag</span>
          Cart
        </button>
      </div>
    </div>
  </nav>

  <main class="forno-main">
    <ng-content></ng-content>
  </main>

  <nav class="forno-bottom-nav" aria-label="Primary tabs">
    <a
      class="forno-bottom-nav__tab"
      routerLink="/home"
      [class.forno-bottom-nav__tab--active]="isActive('/home')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a
      class="forno-bottom-nav__tab"
      routerLink="/menu"
      [class.forno-bottom-nav__tab--active]="isActive('/menu')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="15" y2="18"/></svg>
      Menu
    </a>
    <a
      class="forno-bottom-nav__tab"
      routerLink="/build"
      [class.forno-bottom-nav__tab--active]="isActive('/build')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 2c2.5 2.5 4 6 4 10"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8" cy="10" r="1" fill="currentColor"/><circle cx="14" cy="16" r="1" fill="currentColor"/></svg>
      Build
    </a>
    <button
      class="forno-bottom-nav__tab"
      type="button"
      [class.forno-bottom-nav__tab--active]="cartDrawer.isOpen()"
      (click)="cartDrawer.toggle()">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      @if (cartDrawer.cartCount() > 0) {
        <span class="forno-bottom-nav__badge">{{ cartDrawer.cartCount() }}</span>
      }
      Cart
    </button>
  </nav>

  <app-cart-drawer />
</div>
